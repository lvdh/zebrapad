<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZebraPad</title>
    <link rel="stylesheet" href="/assets/css/bulma.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="tabs is-boxed is-centered">
        <ul>
            <li class="is-active" id="tab-card"><a>Card</a></li>
            <li id="tab-zpl"><a>ZPL</a></li>
        </ul>
    </div>
    <!-- 'Card' tab -->
    <div id="tab-content-card">
        <section class="section">
            <h1 class="title">ZebraPad</h1>
            <h2 class="subtitle">Library Card</h2>
            <div class="container">
                <div class="columns">
                    <div class="column">
                        <form id="card-form">
                            <div class="field">
                                <label class="label">Full Name</label>
                                <div class="control">
                                    <input class="input" type="text" id="card-fullname" name="fullname" placeholder="Full Name">
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">Barcode</label>
                                <div class="control">
                                    <input class="input" type="text" id="card-barcode" name="barcode" placeholder="Barcode">
                                </div>
                            </div>
                            <div class="field m-4">
                                <div class="control">
                                    <div class="buttons">
                                        <button class="button is-primary" type="submit" id="card-print">
                                            Print
                                        </button>
                                        <button class="button is-link" type="submit" id="card-render">
                                            Render
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div id="card-result" class="notification is-hidden"></div>
                    </div>
                    <div class="column">
                        <div id="card-output" class="box is-hidden" style="margin-top: 1em;"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <!-- 'ZPL' tab -->
    <div id="tab-content-zpl" style="display:none;">
        <section class="section">
            <h1 class="title">ZebraPad</h1>
            <h2 class="subtitle">ZPL input</h2>
            <div class="container">
                <div class="columns">
                    <div class="column">
                        <form id="zpl-form">
                            <div class="field">
                                <div class="control">
                                    <textarea class="textarea" id="zpl-input" rows="10">^XA^FO50,50^ADN,36,20^FDTest Label^FS^XZ</textarea>
                                </div>
                            </div>
                            <div class="field m-4">
                                <div class="control">
                                    <div class="buttons">
                                        <button class="button is-primary" type="submit" id="zpl-print">
                                            Print
                                        </button>
                                        <button class="button is-link" type="submit" id="zpl-render">
                                            Render
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div id="zpl-result" class="notification is-hidden"></div>
                    </div>
                    <div class="column">
                        <div id="zpl-output" class="box is-hidden" style="margin-top: 1em;"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script type="text/javascript" src="/assets/js/tabs.js"></script>
    <script type="text/javascript" src="/assets/js/forms.js"></script>
</body>
</html>
